<html>
  <head>
    <title>Scratch CPU Instructions</title>
    <style>
      body {
        margin: 0;
        text-align: center;
        padding-top: 10px;
        font-family: Arial, sans-serif;
      }
      #content {
        margin-top: 15px;
        max-width: 700px;
        margin-left: auto;
        margin-right: auto;
        text-align: left;
      }
      h1 {
        font-size: 22px;
      }
      a {
        color: blue;
      }
    </style>
  </head>
  <body>
    <div id="content"></div>

    <script>
      fetch("https://raw.githubusercontent.com/Lucas6228/scratch-cpu/refs/heads/main/instructions.md")
        .then(r => r.ok ? r.text() : "")
        .then(t => {
          let html = t
            .replace(/^# (.*)$/gm, "<h1>$1</h1>")
            .replace(/\[(.*?)\]\((.*?)\)/g, '<a href="$2" target="_blank">$1</a>')
            .replace(/\n\n+/g, "<br><br>")
            .replace(/\n/g, "<br>");

          document.getElementById("content").innerHTML = html;
        })
        .catch(() => {});
    </script>
  </body>
</html>
